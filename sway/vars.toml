[misc]
launcher = "wmenu-run -N '#222222' -n '#BBBBBB' -S '#FF0000' -s '#EEEEEE' -f 'Fira Code 9'"

[input]
kb_layout = "us"
touchpad = "2:7:SynPS/2_Synaptics_TouchPad"
additional = "xkb_options compose:ralt"

[brightness]
step = "5%"

[monitors]
left = "eDP-1"
additional = ""
# The last lines are automatically generated by the `right-monitor.sh` script
left_config = "resolution 1920x1080 position 0,648"
right = "DP-5"
right_config = "resolution 3840x2160 position 1920,0 scale 1.25"